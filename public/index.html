<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Hero backdrop + reflection map is needed immediately (above the fold). -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/assets/backgrounds/hero-image.webp" />
    <!-- Projects parallax backdrop is below the fold: prefetch at low priority so
         it is cached and paints on time when the visitor scrolls to Projects. -->
    <link rel="prefetch" as="image" href="%PUBLIC_URL%/assets/backgrounds/projects-background.jpg" />

    <script src="https://kit.fontawesome.com/2d9e394acf.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=DotGothic16&family=Orbitron:wght@500..900&display=swap" rel="stylesheet">

    <!-- Self-hosted futuristic display face (plain-background section titles).
         Declared here so the browser resolves the public/ path at runtime and
         the build step never tries to bundle the file.
         NOTE: "Kabisat Demo" is PERSONAL USE ONLY — license before commercial use. -->
    <style>
      @font-face {
        font-family: 'Kabisat';
        src: url('%PUBLIC_URL%/assets/fonts/Kabisat Demo-ItalicTall.ttf') format('truetype');
        font-weight: 100;
        font-style: normal;
        font-display: swap;
      }
    </style>

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>alice's portfolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
